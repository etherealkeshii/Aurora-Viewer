name: Nightly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - scripts/nightly-tag.ps1
      - scripts/nightly-prune.ps1
      - scripts/test-nightly.ps1
      - scripts/tools/nightly.ps1

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'etherealkeshii/Aurora-Viewer' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/keshii/distribution' && github.actor == 'etherealkeshii'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preview next beta version
        shell: pwsh
        run: |
          . ./scripts/tools/nightly.ps1
          git fetch --tags https://github.com/Aurora-Viewer/Aurora-Viewer.git
          if ($LASTEXITCODE -ne 0) { throw 'Upstream tag fetch failed.' }
          $tag = Get-NextKeshiiBetaTag @(git tag --list) ([datetime]::UtcNow)
          Write-Host "Next Keshii beta: $tag"

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fixture tests
        shell: pwsh
        run: ./scripts/test-nightly.ps1
