name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*-Keshii']

concurrency:
  group: keshii-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    if: github.repository == 'etherealkeshii/Aurora-Viewer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/release-admin

      - name: Verify distribution source
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Keshii releases require an explicitly pushed version tag."
            exit 1
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?-Keshii$ ]]; then
            echo "::error::Invalid Keshii release tag."
            exit 1
          fi

          git fetch --no-tags https://github.com/etherealkeshii/Aurora-Viewer.git refs/heads/keshii/distribution:refs/remotes/fork/keshii/distribution

          tagged_commit="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/fork/keshii/distribution; then
            echo "::error::Release commit is not part of the Keshii distribution branch."
            exit 1
          fi

          echo "Verified distribution commit: $tagged_commit"

  windows:
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        shell: pwsh
        run: |
          $env:AURORA_VERSION_TAG = $env:TAG
          $monitor = Start-Job -ScriptBlock {
              while ($true) {
                  $os = Get-CimInstance Win32_OperatingSystem
                  $cpu = Get-CimInstance Win32_Processor
                  $usage = ($cpu | Measure-Object -Property LoadPercentage -Average).Average
                  $free = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
                  $total = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
                  Write-Output "[BUILD MONITOR] CPU: $usage% | Free RAM: $free / $total GiB"
                  Get-Process -Name cargo,rustc,link,lld-link -ErrorAction SilentlyContinue |
                      Select-Object ProcessName,Id,CPU,@{Name='RAM_MB';Expression={[math]::Round($_.WorkingSet64 / 1MB)}},@{Name='Threads';Expression={$_.Threads.Count}} |
                      Format-Table -AutoSize | Out-String | Write-Output
                  Start-Sleep -Seconds 60
              }
          }
          $build = $null
          try {
              $build = Start-Process -FilePath cargo -ArgumentList @(
                  'build', '--release', '--locked', '--verbose', '--timings',
                  '-p', 'aurora-viewer', '--features', 'xr-static-loader'
              ) -NoNewWindow -PassThru
              while (-not $build.HasExited) {
                  Receive-Job -Job $monitor
                  Start-Sleep -Seconds 5
                  $build.Refresh()
              }
              Receive-Job -Job $monitor
              if ($build.ExitCode -ne 0) {
                  throw "Cargo build failed with exit code $($build.ExitCode)"
              }
          } finally {
              Stop-Job -Job $monitor
              Remove-Job -Job $monitor -Force
          }
      - name: Verify compiled version
        shell: pwsh
        run: |
          ./scripts/verify-version.ps1 -Exe target/release/aurora-viewer-Keshii.exe -Tag $env:TAG
      - name: Install dump_syms
        run: cargo install dump_syms --locked --version 2.3.9
      - name: Symbols
        shell: pwsh
        run: |
          dump_syms target/release/aurora-viewer-Keshii.exe --store symbols
          if ($LASTEXITCODE -ne 0) { throw 'dump_syms failed' }
          $zip = "Aurora-Viewer-$($env:TAG -replace '^v', '')-windows-x64-symbols.zip"
          & 7z a -tzip -mx=9 $zip ./symbols/* | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding utf8NoBOM
          Get-ChildItem symbols -Recurse -File | ForEach-Object { "$($_.FullName.Substring((Resolve-Path symbols).Path.Length + 1)) $([math]::Round($_.Length / 1MB)) MB" }
          "zip $([math]::Round((Get-Item $zip).Length / 1MB)) MB"
          "SYMBOLS=$zip" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: |
          $v = $env:TAG -replace '^v', ''
          $dir = "Aurora-Viewer-$v-windows-x64"
          ./scripts/package.ps1 -Exe target/release/aurora-viewer-Keshii.exe -Out $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash -LiteralPath "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content -LiteralPath "$dir.zip.sha256" -Encoding utf8NoBOM
          ./scripts/write-update-policy.ps1 -Tag $env:TAG
          "ZIP=$dir.zip" >> $env:GITHUB_ENV
      - name: Release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            ${{ env.SYMBOLS }}
            ${{ env.SYMBOLS }}.sha256
            aurora-update-policy.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  linux:
    needs: [authorize, windows]
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          export AURORA_VERSION_TAG="$TAG"
          cargo build --release --locked --verbose --timings -p aurora-viewer
      - name: Verify compiled version
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/aurora-viewer-Keshii -Tag $env:TAG
      - name: Package
        shell: pwsh
        run: |
          $v = $env:TAG -replace '^v', ''
          $dir = "Aurora-Viewer-$v-linux-x64"
          ./scripts/package.ps1 -Exe target/release/aurora-viewer-Keshii -Out $dir
          & tar -czf "$dir.tar.gz" $dir
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          $hash = (Get-FileHash -LiteralPath "$dir.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.tar.gz" | Set-Content -LiteralPath "$dir.tar.gz.sha256" -Encoding utf8NoBOM
          "ARCHIVE=$dir.tar.gz" >> $env:GITHUB_ENV
      - name: Release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  macos:
    needs: [authorize, linux]
    if: needs.authorize.result == 'success'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
      APP: Aurora Viewer-Keshii.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          export AURORA_VERSION_TAG="$TAG"
          cargo build --release --locked --verbose --timings -p aurora-viewer
      - name: Verify compiled version
        shell: pwsh
        run: ./scripts/verify-version.ps1 -Exe target/release/aurora-viewer-Keshii -Tag $env:TAG
      - name: Application
        shell: pwsh
        run: ./scripts/package-macos.ps1 -Exe target/release/aurora-viewer-Keshii -Out $env:APP
      - name: Sign (ad hoc)
        run: codesign --force --sign - "$APP"
      - name: Check the application
        run: |
          codesign --verify --strict --verbose=2 "$APP"
          test "$(uname -m)" = arm64
          lipo "$APP/Contents/MacOS/aurora-viewer-Keshii" -verify_arch arm64
          "$APP/Contents/MacOS/aurora-viewer-Keshii" --version
      - name: Disk image
        run: |
          dmg="Aurora-Viewer-${TAG#v}-macOS-arm64.dmg"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$APP" "$stage/$APP"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Aurora Viewer-Keshii" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "ARCHIVE=$dmg" >> "$GITHUB_ENV"
      - name: Release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: [authorize, windows, linux, macos]
    if: github.repository == 'etherealkeshii/Aurora-Viewer' && github.event_name == 'push' && github.ref_type == 'tag' && github.actor == 'etherealkeshii' && github.triggering_actor == 'etherealkeshii'
    runs-on: ubuntu-latest
    environment: keshii-release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/release-admin

      - name: Download Windows files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-windows

      - name: Download Linux files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-linux

      - name: Download macOS files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-macos

      - name: Verify release files
        shell: bash
        run: |
          version="${TAG#v}"
          for package in             "Aurora-Viewer-$version-windows-x64.zip"             "Aurora-Viewer-$version-windows-x64-symbols.zip"             "Aurora-Viewer-$version-linux-x64.tar.gz"             "Aurora-Viewer-$version-macOS-arm64.dmg"; do
            test -s "$package"
            test -s "$package.sha256"
            sha256sum --check --strict "$package.sha256"
          done
          test -s aurora-update-policy.json

      - name: Sign for the updater
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.KESHII_UPDATE_SIGNING_KEY }}
        run: |
          $v = $env:TAG -replace '^v', ''
          ./scripts/sign-release.ps1 -Files @(
            "Aurora-Viewer-$v-windows-x64.zip.sha256",
            "Aurora-Viewer-$v-windows-x64-symbols.zip.sha256",
            "Aurora-Viewer-$v-linux-x64.tar.gz.sha256",
            "Aurora-Viewer-$v-macOS-arm64.dmg.sha256",
            "aurora-update-policy.json"
          )

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: etherealkeshii/Aurora-Viewer
        run: |
          set -euo pipefail
          version="${TAG#v}"
          files=()
          for package in             "Aurora-Viewer-$version-windows-x64.zip"             "Aurora-Viewer-$version-windows-x64-symbols.zip"             "Aurora-Viewer-$version-linux-x64.tar.gz"             "Aurora-Viewer-$version-macOS-arm64.dmg"; do
            files+=("$package" "$package.sha256" "$package.sha256.sig")
          done
          files+=(aurora-update-policy.json aurora-update-policy.json.sig)
          gh release create "$TAG" "${files[@]}"             --repo "$GH_REPO"             --title "Aurora Viewer-Keshii $version"             --notes-file .github/release-notes-header.md             --generate-notes             --verify-tag             --draft
          gh release edit "$TAG"             --repo "$GH_REPO"             --draft=false             --prerelease=false             --latest
